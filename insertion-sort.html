<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>插入排序可视化</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .container { background: white; border-radius: 10px; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3); padding: 40px; max-width: 900px; width: 100%; }
        h1 { text-align: center; color: #333; margin-bottom: 20px; }
        .input-section, .speed-control, .button-group, .info, .visualization, .output { margin-bottom: 20px; }
        .info { background: #f0f4ff; padding: 15px; border-radius: 5px; border-left: 4px solid #667eea; }
        .info-text { color: #333; line-height: 1.6; }
        .tutorial { background: #fff9c4; padding: 15px; border-radius: 5px; border-left: 4px solid #ffca28; margin-bottom: 20px; }
        .tutorial p { margin-bottom: 12px; color: #333; line-height: 1.6; }
        .input-section label, .speed-control label { color: #555; font-weight: 500; display: block; margin-bottom: 8px; }
        .input-section input, .speed-control input[type="range"] { width: 100%; }
        .input-section input { padding: 12px; border: 2px solid #ddd; border-radius: 5px; font-size: 16px; margin-bottom: 12px; }
        .input-section input:focus { border-color: #667eea; outline: none; }
        .button-group { display: flex; flex-wrap: wrap; gap: 10px; }
        button { padding: 12px 24px; border: none; border-radius: 5px; font-size: 16px; cursor: pointer; font-weight: 600; transition: all 0.2s ease; }
        .btn-sort { background: #667eea; color: white; }
        .btn-reset { background: #f093fb; color: white; }
        .btn-example { background: #4facfe; color: white; }
        .btn-sort:hover { background: #5568d3; transform: translateY(-1px); }
        .btn-reset:hover { background: #da7dd8; transform: translateY(-1px); }
        .btn-example:hover { background: #3e96d8; transform: translateY(-1px); }
        .visualization { background: #f5f5f5; padding: 30px; border-radius: 5px; min-height: 150px; display: flex; align-items: flex-end; justify-content: center; gap: 5px; }
        .bar { background: #667eea; min-width: 30px; border-radius: 3px; transition: all 0.2s cubic-bezier(0.4,0,0.2,1); display: flex; align-items: flex-end; justify-content: center; color: white; font-size: 12px; font-weight: bold; }
        .bar.comparing { background: #f093fb; }
        .bar.current-insert { background: #ff9800; }
        .bar.sorted { background: #4caf50; }
        .output { background: #263238; color: #4fc3f7; padding: 20px; border-radius: 5px; font-family: 'Courier New', monospace; overflow-x: auto; min-height: 100px; }
        .output-title { color: #fff; margin-bottom: 10px; font-weight: bold; }
        .speed-value { color: #667eea; font-weight: bold; margin-left: 10px; }
        .back-link { display: inline-block; margin-top: 10px; padding: 10px 20px; background: #f093fb; color: white; text-decoration: none; border-radius: 5px; font-weight: 600; }
        .back-link:hover { background: #da7dd8; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📌 插入排序可视化</h1>
        <a href="index.html" class="back-link">← 返回首頁</a>

        <div class="info">
            <div class="info-text"><strong>插入排序（Insertion Sort）</strong> 是将数组分成已排序区间和未排序区间，然后逐个取未排序元素，向左扫描已排序区间并插入合适位置的算法。</div>
        </div>

        <div class="tutorial">
            <p><strong>示范步骤：</strong></p>
            <p>1) 假设第一个元素已排序；</p>
            <p>2) 取下一个元素 `key`，从已排序区间右侧开始向左比较；</p>
            <p>3) 如果左侧元素 > key，则向右移动；</p>
            <p>4) 找到插入位置后放置 key，已排序区间长度 +1；</p>
            <p>5) 重复直到所有元素排序完成。时间复杂度：O(n²)，空间复杂度：O(1)。</p>
        </div>

        <div class="input-section">
            <label for="arrayInput">输入数字（逗号分隔）：</label>
            <input type="text" id="arrayInput" placeholder="例如：64,34,25,12,22,11,90" value="64,34,25,12,22,11,90">
        </div>

        <div class="speed-control">
            <label for="speedControl">排序速度：</label>
            <input type="range" id="speedControl" min="50" max="1000" value="300" step="50">
            <span class="speed-value" id="speedValue">300ms</span>
        </div>

        <div class="button-group">
            <button class="btn-sort" onclick="startSort()">开始排序</button>
            <button class="btn-reset" onclick="resetArray()">重置</button>
            <button class="btn-example" onclick="loadExample()">加载示例</button>
        </div>

        <div class="visualization" id="visualization"></div>

        <div class="output">
            <div class="output-title">排序结果：</div>
            <div id="output">等待排序...</div>
        </div>
    </div>

    <script>
        let currentArray = [];
        let isSorting = false;

        window.addEventListener('load', () => {
            loadExample();
            document.getElementById('speedControl').addEventListener('input', (e) => {
                document.getElementById('speedValue').textContent = e.target.value + 'ms';
            });
        });

        function loadExample() {
            document.getElementById('arrayInput').value = '64,34,25,12,22,11,90';
            resetArray();
        }

        function resetArray() {
            const input = document.getElementById('arrayInput').value;
            currentArray = input.split(',').map(x => parseInt(x.trim())).filter(x => !isNaN(x));
            if (currentArray.length === 0) {
                alert('请输入有效的数字！');
                return;
            }
            renderBars();
            document.getElementById('output').textContent = '数组已重置：' + currentArray.join(', ');
            isSorting = false;
        }

        function renderBars(comparingIndices = [], currentInsertIndex = -1, sortedIndices = []) {
            const viz = document.getElementById('visualization');
            viz.innerHTML = '';
            const maxValue = Math.max(...currentArray);
            const barWidth = Math.max(30, 800 / currentArray.length);

            currentArray.forEach((value, index) => {
                const bar = document.createElement('div');
                bar.className = 'bar';
                bar.style.height = (value / maxValue * 300) + 'px';
                bar.style.width = barWidth + 'px';
                bar.textContent = value;

                if (sortedIndices.includes(index)) {
                    bar.classList.add('sorted');
                } else if (index === currentInsertIndex) {
                    bar.classList.add('current-insert');
                } else if (comparingIndices.includes(index)) {
                    bar.classList.add('comparing');
                }

                viz.appendChild(bar);
            });
        }

        async function startSort() {
            if (isSorting) return;
            if (currentArray.length < 2) {
                alert('请输入至少2个数字！');
                return;
            }

            isSorting = true;
            const speed = parseInt(document.getElementById('speedControl').value);
            const arr = [...currentArray];
            const n = arr.length;
            let sortedCount = 1;

            document.getElementById('output').textContent = '排序中...';
            renderBars([], -1, [0]);
            await sleep(speed);

            for (let i = 1; i < n; i++) {
                let key = arr[i];
                let j = i - 1;

                renderBars([i], i, [...Array(sortedCount).keys()]);
                await sleep(speed);

                while (j >= 0 && arr[j] > key) {
                    arr[j + 1] = arr[j];
                    currentArray[j + 1] = currentArray[j];
                    renderBars([j, j + 1], i, [...Array(sortedCount).keys()]);
                    await sleep(speed);
                    j = j - 1;
                }

                arr[j + 1] = key;
                currentArray[j + 1] = key;
                sortedCount = i + 1;

                renderBars([], -1, [...Array(sortedCount).keys()]);
                await sleep(speed);
            }

            renderBars([], -1, [...Array(n).keys()]);
            document.getElementById('output').textContent = '✅ 排序完成！结果：' + currentArray.join(', ');
            isSorting = false;
        }

        function sleep(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }
    </script>
</body>
</html>
